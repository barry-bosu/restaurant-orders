version: "3.8"

services:
  backend:
    image: restaurant-orders-backend:swarm
    environment:
      DATABASE_URL: postgresql+psycopg2://restaurant:restaurant_swarm_password@postgres:5432/restaurant_db
      REDIS_URL: redis://redis:6379/0
    networks:
      - restaurant-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant_swarm_password
      POSTGRES_DB: restaurant_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7-alpine
    networks:
      - restaurant-network
    deploy:
      replicas: 1

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8091:8080"
    networks:
      - restaurant-network
    deploy:
      replicas: 1

  frontend:
    image: restaurant-orders-frontend:swarm
    networks:
      - restaurant-network
    deploy:
      replicas: 1

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    configs:
      - source: nginx_config_v2
        target: /etc/nginx/conf.d/default.conf
    networks:
      - restaurant-network
    deploy:
      replicas: 1

networks:
  restaurant-network:
    driver: overlay

volumes:
  postgres_data:

configs:
  nginx_config_v2:
    external: true
    name: restaurant_nginx_config_v2