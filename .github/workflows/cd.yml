
name: Restaurant Orders CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publicar imagenes Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar nombre de imagenes
        id: images
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.owner }}/restaurant-orders-backend:latest
            ghcr.io/${{ steps.images.outputs.owner }}/restaurant-orders-backend:${{ github.sha }}

      - name: Publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.owner }}/restaurant-orders-frontend:latest
            ghcr.io/${{ steps.images.outputs.owner }}/restaurant-orders-frontend:${{ github.sha }}
