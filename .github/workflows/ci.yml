
name: Restaurant Orders CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Comprobar sintaxis Python
        run: python -m compileall -q backend

      - name: Construir imagen Docker backend
        run: docker build -t restaurant-orders-backend:ci ./backend

      - name: Construir imagen Docker frontend
        run: docker build -t restaurant-orders-frontend:ci ./frontend
