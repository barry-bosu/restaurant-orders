
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: restaurant-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localhost:5000/restaurant-orders-backend:k8s
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://restaurant:restaurant_k8s_password@postgres:5432/restaurant_db"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: restaurant-orders
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
