services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant_dev_password
      POSTGRES_DB: restaurant_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - restaurant-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - restaurant-network

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - restaurant-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - restaurant-network

networks:
  restaurant-network:
    driver: bridge

volumes:
  postgres_data: